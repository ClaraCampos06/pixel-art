<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="teste.css">

    <title>Nossa Vida</title>
</head>

<body>

    <div class="box">

        <div class="titulo">
            <h1>NOSSA VIDA</h1>
        </div>


        <div class="escolhas">

            <!-- LUGAR -->
            <div class="card">
                <div class="foto">
                    <img id="fotoLugar" src="" alt="Lugar escolhido">
                </div>

                <h2>NOSSO LAR</h2>

                <p id="nomeLugar"></p>
            </div>


            <!-- FILHA -->
            <div class="card">
                <div class="foto">
                    <img id="fotoFilha" src="" alt="Filha escolhida">
                </div>

                <h2>NOSSA FILHA</h2>

                <p id="nomeFilha"></p>
            </div>


            <!-- PET -->
            <div class="card">
                <div class="foto">
                    <img id="fotoPet" src="" alt="Pet escolhido">
                </div>

                <h2>NOSSO PET</h2>

                <p id="nomePet"></p>
            </div>

        </div>

    </div>

    <script src="teste.js"></script>

</body>

</html>
